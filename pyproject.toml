[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crypto-typesafe-router"
version = "0.1.0"
description = "Route natural-language crypto market commands to typed functions via TypeSafe System One (Jev)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typesafe-sdk>=0.7.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
crypto-router = "crypto_router.cli:main"

[tool.hatch.build]
[tool.hatch.build.targets.wheel]
only-include = ["crypto_router"]

[tool.hatch.build.targets.wheel.sources]
"src/crypto_router" = "crypto_router"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
